name: "👤 🤖 Auto-assign"

# Assigns every new pull request and issue to the maintainer, except the pull requests the nightly dependency
# pipeline (sliceworkz/software-factory) opens: the pipeline assigns those itself, and only the ones that wait for a
# person (assignees in .github/dependency-policy.yaml), since the branch name cannot tell which PRs merge by
# themselves.

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign:
    if: >-
      !(github.event_name == 'pull_request'
        && github.event.pull_request.user.login == 'sliceworkz-software-factory[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Assign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'issue' }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh "$KIND" edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-assignee vanrogu
