name: auto-assign-issues

on:
  pull_request:
    types: [opened]
    
permissions:
  pull-requests: write
  
jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --add-assignee "vanrogu"
