name: build-and-deploy-from-release-tag

run-name: "build-and-deploy-from-release-tag [${{ github.ref_name }}]"

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      # to sign the SBOM's build provenance and attest the SBOM to the jars (GitHub artifact attestations)
      id-token: write
      attestations: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # the release notes baseline is derived from the tag list, which a
          # shallow checkout does not fetch
          fetch-depth: 0
      
      # Grype, the vulnerability scanner, with its database (about 3 GB unpacked) downloading in the
      # background while the build runs; scan.sh waits for it (.github/vulnerability-scan/scan.sh)
      - name: Install Grype
        run: .github/vulnerability-scan/scan.sh install
      - name: Download the vulnerability database
        run: .github/vulnerability-scan/scan.sh prefetch

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn -B -DskipTests clean install -Pgpg-ci
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy to Maven Central
        run: mvn -B -DskipTests deploy -Pgpg-ci
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      
      # Without this, gh lets GitHub infer the baseline for the generated notes,
      # and GitHub infers it as the newest tag reachable from the tagged commit.
      # Release tags are created on release/<major>.<minor>, which is cut from
      # develop and never merged back, so for the first release of every minor
      # line that walk reaches past the whole branch into develop and finds
      # whichever tag was last merged there -- not the previous release. The
      # previous release is a question about version order, so ask it directly.
      - name: Determine previous release tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$( git tag --list 'v*.*.*' --sort=-v:refname \
                          | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' \
                          | awk -v current="${{ github.ref_name }}" \
                                'found { print; exit } $0 == current { found = 1 }' )

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Release notes baseline: $PREVIOUS_TAG"
          else
            echo "No earlier release tag found; leaving the baseline to GitHub"
          fi

          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: |
          BASELINE=()
          if [ -n "${{ steps.previous_tag.outputs.PREVIOUS_TAG }}" ]; then
            BASELINE=( --notes-start-tag "${{ steps.previous_tag.outputs.PREVIOUS_TAG }}" )
          fi

          gh release create ${{ github.ref_name }} \
            --title "Release ${{ steps.get_version.outputs.VERSION }}" \
            --generate-notes \
            "${BASELINE[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The software bill of materials of this release, as the EU Cyber Resilience Act
      # asks for: the CycloneDX aggregate the Maven build wrote over the runtime library
      # (no test scope), and beside it the test kit's own, kept apart so its JUnit and
      # Testcontainers are not read as dependencies of the library. Each module also
      # carries its own SBOM to the Maven repository, deployed above as its "cyclonedx"
      # classifier.
      - name: Collect the SBOM
        run: |
          mkdir -p sbom
          cp target/bom.json "sbom/sliceworkz-eventstore-${{ steps.get_version.outputs.VERSION }}.cdx.json"
          cp sliceworkz-eventstore-testing/target/bom.json "sbom/sliceworkz-eventstore-testing-${{ steps.get_version.outputs.VERSION }}.cdx.json"

      # Signed build provenance for the SBOM: binds it to this commit and this workflow
      # run, verifiable with 'gh attestation verify <file> --repo sliceworkz/eventstore'.
      - name: Attest the SBOM's provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sbom/*.cdx.json

      # The SBOM attested to the jars it describes, so a consumer holding a jar from Maven
      # Central can verify which SBOM belongs to it and that this workflow run produced both:
      #   gh attestation verify <jar> --repo sliceworkz/eventstore \
      #     --predicate-type https://cyclonedx.org/bom
      # The library's aggregate goes to the library's jars, the test kit's SBOM to its own.
      - name: Attest the SBOM to the library's jars
        uses: actions/attest@v4
        with:
          sbom-path: sbom/sliceworkz-eventstore-${{ steps.get_version.outputs.VERSION }}.cdx.json
          subject-path: |
            sliceworkz-eventstore-api/target/sliceworkz-eventstore-api-${{ steps.get_version.outputs.VERSION }}.jar
            sliceworkz-eventstore-impl/target/sliceworkz-eventstore-impl-${{ steps.get_version.outputs.VERSION }}.jar
            sliceworkz-eventstore-serialization-json/target/sliceworkz-eventstore-serialization-json-${{ steps.get_version.outputs.VERSION }}.jar
            sliceworkz-eventstore-infra-inmem/target/sliceworkz-eventstore-infra-inmem-${{ steps.get_version.outputs.VERSION }}.jar
            sliceworkz-eventstore-infra-inmem-fs/target/sliceworkz-eventstore-infra-inmem-fs-${{ steps.get_version.outputs.VERSION }}.jar
            sliceworkz-eventstore-infra-postgres/target/sliceworkz-eventstore-infra-postgres-${{ steps.get_version.outputs.VERSION }}.jar

      - name: Attest the test kit's SBOM to its jar
        uses: actions/attest@v4
        with:
          sbom-path: sbom/sliceworkz-eventstore-testing-${{ steps.get_version.outputs.VERSION }}.cdx.json
          subject-path: sliceworkz-eventstore-testing/target/sliceworkz-eventstore-testing-${{ steps.get_version.outputs.VERSION }}.jar

      # Report only: the gate ran before the tag was created (create-release-tag-and-bump), and a release
      # that is already tagged is not stopped here. The findings are in the job summary and the
      # vulnerability-reports artifact.
      - name: Report known vulnerabilities in the release
        continue-on-error: true
        run: |
          for sbom in sbom/*.cdx.json; do
            .github/vulnerability-scan/scan.sh report "$sbom" "$(basename "$sbom" .cdx.json)"
          done
      - name: Keep the vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-reports
          path: ${{ runner.temp }}/vulnerability-scan/reports/
          if-no-files-found: ignore

      - name: Attach the SBOM to the GitHub release
        run: gh release upload ${{ github.ref_name }} sbom/*.cdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
