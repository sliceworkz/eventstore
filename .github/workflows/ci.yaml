name: ci build - mvn package

run-name: "ci build - mvn package [${{ github.ref_name }}]"

# Builds and tests every push and pull request. A push to develop also deploys the SNAPSHOT to the
# sliceworkz cloudrepo, so what downstream builds resolve is always what develop holds. To deploy
# another branch on purpose, run this workflow by hand on it ("Use workflow from") with "deploy"
# ticked; that overwrites the shared SNAPSHOT until the next push to develop deploys again.
#
# A deploying run builds and tests once and deploys what it built. Deploying runs of this repository
# share one concurrency group, so two quick merges deploy one after the other rather than
# interleaving their uploads; a run that is not deploying never waits on them.
#
# Runs directly on the runner (no container) so that setup-java's generated ~/.m2/settings.xml, the
# one carrying the cloudrepo credentials, is the settings.xml Maven loads.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this branch's SNAPSHOT to cloudrepo"
        type: boolean
        default: false
  push:
    branches: [ "develop", "feature/*", "release/*" ]
  pull_request:
    branches: [ "develop", "release/*" ]

# Checking out is all the GITHUB_TOKEN is used for: the artifacts go up with the runner's own token and the
# deploy with the cloudrepo credentials. Without this the token gets the repository's default, which may be write
permissions:
  contents: read

# Maven 4 is not on the runner yet: each job installs this release candidate from the Apache
# archive, on the runner host, where setup-java's generated ~/.m2/settings.xml is the one Maven loads.
env:
  MAVEN_VERSION: 4.0.0-rc-7

jobs:
  build:

    runs-on: ubuntu-latest
    # a build normally finishes well within this; past it something hangs, and GitHub's default would wait six hours
    timeout-minutes: 20

    concurrency:
      group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && 'cloudrepo-snapshot' || format('ci-{0}', github.run_id) }}
      cancel-in-progress: false

    env:
      DEPLOY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
      CLOUDREPO_USERNAME: ${{ secrets.CLOUDREPO_USERNAME }}
      CLOUDREPO_PASSWORD: ${{ secrets.CLOUDREPO_PASSWORD }}

    steps:
    - uses: actions/checkout@v7
    # Grype, the vulnerability scanner, with its database (about 3 GB unpacked) downloading in the
    # background while the build runs; scan.sh waits for it (.github/vulnerability-scan/scan.sh)
    - name: Install Grype
      run: .github/vulnerability-scan/scan.sh install
    - name: Download the vulnerability database
      run: .github/vulnerability-scan/scan.sh prefetch
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: cloudrepo
        server-username-env-var: CLOUDREPO_USERNAME
        server-password-env-var: CLOUDREPO_PASSWORD
    - name: Install Maven ${{ env.MAVEN_VERSION }}
      run: |
        curl -fsSL "https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
          | tar -xz -C "$HOME"
        echo "$HOME/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
    - name: Verify Maven version
      run: mvn -version
    - name: Verify SNAPSHOT version
      if: env.DEPLOY == 'true'
      run: |
        CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --raw-streams)
        echo "Current version: $CURRENT_VERSION"
        if [[ ! "$CURRENT_VERSION" =~ -SNAPSHOT$ ]]; then
          echo "Error: Version $CURRENT_VERSION is not a SNAPSHOT version"
          echo "Only SNAPSHOT builds are deployed to cloudrepo."
          exit 1
        fi
    - name: Build with Maven
      if: env.DEPLOY != 'true'
      run: mvn -B package --file pom.xml
    - name: Build with Maven and deploy the SNAPSHOT to cloudrepo
      if: env.DEPLOY == 'true'
      run: mvn -B -Pcloudrepo deploy --file pom.xml
    # The SBOMs of this commit, for the nightly dependency pipeline: it scans these instead of building the
    # branch again. The paths are those of .github/vulnerability-scan/targets
    - name: Keep the SBOMs
      uses: actions/upload-artifact@v7
      with:
        name: sboms
        path: |
          target/bom.json
          sliceworkz-eventstore-testing/target/bom.json
        retention-days: 7
        if-no-files-found: warn
    # Fails on a High or Critical vulnerability with a fix available, unless the VEX file (.vex/openvex.json)
    # has a statement on it. What to do then: SECURITY-RELEASES.md
    - name: Scan the SBOMs for known vulnerabilities
      run: .github/vulnerability-scan/scan.sh project gate
    - name: Keep the vulnerability reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: vulnerability-reports
        path: ${{ runner.temp }}/vulnerability-scan/reports/
        if-no-files-found: ignore
