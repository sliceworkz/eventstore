name: create-release-tag-and-bump - on release/<major>.<micro>

run-name: "create-release-tag-and-bump on [${{ github.ref_name }}]"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Maven 4 is not on the runner yet: each job installs this release candidate from the Apache
# archive, on the runner host, where setup-java's generated ~/.m2/settings.xml is the one Maven loads.
env:
  MAVEN_VERSION: 4.0.0-rc-7

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Reading only: the pushes below use the App's token, which no step running Maven ever sees
          persist-credentials: false
      
      # Grype, the vulnerability scanner, with its database (about 3 GB unpacked) downloading in the
      # background while the build runs; scan.sh waits for it (.github/vulnerability-scan/scan.sh)
      - name: Install Grype
        run: .github/vulnerability-scan/scan.sh install
      - name: Download the vulnerability database
        run: .github/vulnerability-scan/scan.sh prefetch

      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH_NAME"
          
          if [[ ! "$BRANCH_NAME" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Current branch must match pattern 'release/<major>.<minor>'"
            echo "Current branch is: $BRANCH_NAME"
            exit 1
          fi
          
          # Extract major and minor version
          VERSION_PREFIX=$(echo "$BRANCH_NAME" | sed 's/release\///')
          echo "VERSION_PREFIX=$VERSION_PREFIX" >> $GITHUB_ENV
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
      
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: cloudrepo
          server-username-env-var: CLOUDREPO_USERNAME
          server-password-env-var: CLOUDREPO_PASSWORD
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Verify Maven version
        run: mvn -version
      
      - name: Get current Maven version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --raw-streams)
          echo "Current version: $CURRENT_VERSION"
          
          # Validate version format (should be X.Y.Z-SNAPSHOT)
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Error: Current version must be in format X.Y.Z-SNAPSHOT"
            echo "Found: $CURRENT_VERSION"
            exit 1
          fi
          
          # Extract version components
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          
          # Extract major, minor, micro
          IFS='.' read -r MAJOR MINOR MICRO <<< "$RELEASE_VERSION"
          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV
          echo "MICRO=$MICRO" >> $GITHUB_ENV
          
          # Validate that major.minor matches branch
          if [[ "$MAJOR.$MINOR" != "$VERSION_PREFIX" ]]; then
            echo "Error: Version prefix $MAJOR.$MINOR doesn't match branch prefix $VERSION_PREFIX"
            exit 1
          fi
      
      - name: Update workflow run name
        run: |
          echo "::notice title=create-release-tag-and-bump - release: v$RELEASE_VERSION"
      
      # The vulnerability gate, before anything is changed: a release with a known High or Critical
      # vulnerability that has a fix stops here, with no commit, tag or version bump, so its version
      # number is not lost. SECURITY-RELEASES.md says what to do then: fix it, or record a statement in
      # the VEX file (.vex/openvex.json) and run this workflow again.
      - name: Build the SBOMs of the release
        env:
          CLOUDREPO_USERNAME: ${{ secrets.CLOUDREPO_USERNAME }}
          CLOUDREPO_PASSWORD: ${{ secrets.CLOUDREPO_PASSWORD }}
        run: |
          mvn -B -DskipTests package
      - name: Scan the release for known vulnerabilities
        run: .github/vulnerability-scan/scan.sh project gate
      - name: Keep the vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-reports
          path: ${{ runner.temp }}/vulnerability-scan/reports/
          if-no-files-found: ignore

      # The App's token, made after the build and the scan so it cannot expire before the pushes (it lasts an hour).
      # What it pushes starts the workflows a push with the workflow's own token would not: the release
      # workflow on the tag, CI on the branch. It is handed only to the steps that push or ask GitHub.
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Commit identity of the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          echo "Setting version to $RELEASE_VERSION"
          mvn versions:set -DnewVersion=$RELEASE_VERSION -DprocessAllModules -DgenerateBackupPoms=false
          
          git add .
          git commit -m "Release version $RELEASE_VERSION" || echo "No changes to commit"
      
      # Before anything is tagged or pushed: a release must not depend on a SNAPSHOT
      # (requireReleaseDeps in the root pom, active now that the version is a release).
      # Failing here stops the job with nothing pushed -- no tag, no version bump -- so the
      # fix is to correct the dependency version on this branch and run the workflow again.
      - name: Check the release has no SNAPSHOT dependencies
        run: mvn -B validate
        env:
          CLOUDREPO_USERNAME: ${{ secrets.CLOUDREPO_USERNAME }}
          CLOUDREPO_PASSWORD: ${{ secrets.CLOUDREPO_PASSWORD }}

      - name: Create tag
        run: |
          TAG_NAME="v$RELEASE_VERSION"
          echo "Creating tag: $TAG_NAME"
          
          git tag -a "$TAG_NAME" -m "Release version $RELEASE_VERSION"
      
      - name: Set next development version
        run: |
          NEXT_MICRO=$((MICRO + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_MICRO-SNAPSHOT"
          echo "Setting next development version to $NEXT_VERSION"
          
          mvn versions:set -DnewVersion=$NEXT_VERSION -DprocessAllModules -DgenerateBackupPoms=false
          
          git add .
          git commit -m "Prepare for next development iteration: $NEXT_VERSION"
      
      # The tag and the branch in one atomic push: both land or neither does, so a refused push leaves
      # nothing behind and the workflow can simply be run again
      - name: Push the tag and the branch
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" push --atomic origin "v$RELEASE_VERSION" "$BRANCH_NAME"

      - name: Summary
        run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Released Version**: $RELEASE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created**: v$RELEASE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Dev Version**: $MAJOR.$MINOR.$((MICRO + 1))-SNAPSHOT" >> $GITHUB_STEP_SUMMARY
