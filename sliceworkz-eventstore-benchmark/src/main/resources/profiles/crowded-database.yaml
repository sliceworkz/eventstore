name: crowded-database
description: >
  read-shapes over a store sharing its database with three million-event stores under other table
  prefixes. A different mechanism from crowded-store and reported separately for exactly that reason:
  other tables add no row to any query this store issues, so anything that moves here moved through
  shared buffers, WAL, autovacuum or the cluster-wide notification queue.

  Expect a smaller effect than crowded-store, and treat a large one as a finding rather than as
  confirmation -- it would mean the store is losing to its neighbours somewhere it does not read.

corpus:
  volume: 100000
  streamDesign: TAGGED
  composition: MULTI_STORE
  payload: REALISTIC
  entityCount: 2000
  neighbourVolumes: [ 1000000, 1000000, 1000000 ]
  seed: 20260823

targets:
  - backend: INMEM
    metrics: OFF
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF

jmh:
  workloads:
    - query-stream-page
    - query-by-type
    - query-by-tag-needle
    - query-by-tag-swathe
    - query-by-entity-hot
    - query-by-entity-cold
    - query-by-multi-tag
    - query-by-or-groups
    - query-last-event
    - query-cursor-walk
    - query-by-id
    - query-wildcard
  threads: [ 1 ]
  # Three forks, not two. The first run of this trio put five inmem measurements above the 10%
  # relative error the report itself calls uncomparable -- query-by-tag-swathe at 74.7% and
  # query-by-multi-tag at 49.3% -- and the spread was *between* forks and tight within them: fork 1
  # gave 0.148-0.158 on swathe where fork 2 gave 0.089-0.101. That is a per-JVM regime, so the fork
  # is the sampling unit and two of them is n=2. More iterations inside a fork would only measure
  # the same regime longer. read-shapes, crowded-store and crowded-database carry identical settings
  # on purpose: the first is the control the other two are compared against, and a control measured
  # differently is not one.
  forks: 3
  warmupIterations: 2
  measurementIterations: 4
  iterationSeconds: 5
