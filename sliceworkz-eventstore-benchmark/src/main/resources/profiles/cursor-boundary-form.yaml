name: cursor-boundary-form
description: >
  Whether the two equivalent spellings of the (event_tx, event_position) boundary cost the same. Both
  targets are the same container, the same corpus and the same workloads; the only difference is
  whether a cursor is written as the hand-written disjunction the store has always used or as a SQL
  row constructor comparison.

  What is under test. A boundary is nearly always conjoined with stream_context = ? AND
  stream_purpose = ?, and idx_events_stream_position is (stream_context, stream_purpose, event_tx,
  event_position). With the leading two pinned by equality, a row comparison over the trailing two is
  something a btree can turn into a start condition: descend to the cursor, walk the leaves in order,
  stop at the LIMIT, so a page costs what the page returns. A disjunction is not a start condition,
  so the same predicate becomes a filter over the whole stream or a BitmapOr whose unordered result
  needs a sort above it -- and a sort stops the LIMIT being pushed into the scan. Both of those are
  proportional to how deep the cursor already sits rather than to the page size, which is the wrong
  shape for the way Projector pages.

  That is a theory, and it is exactly the kind a benchmark exists to refuse. Whether PostgreSQL
  really builds the start condition for a row comparison over index columns three and four, on xid8,
  is not something to reason out -- so read the captured plans in the report before the numbers. The
  claim is only established if the row-comparison target's plan for query-cursor-walk is an ordered
  index scan where the other target's is not.

corpus:
  # Deliberately the same spec as dcb-plan-cache, to the seed: a corpus is content-addressed, so an
  # identical spec is an identical fingerprint and an identical table prefix. This profile therefore
  # measures against a corpus that already exists rather than provisioning a second copy of it.
  #
  # 100.000 rather than the small tier because the effect under test grows with how far into a stream
  # the cursor sits. At 5.000 events the whole table is a few hundred pages and a filtered scan of it
  # is microseconds, so both spellings would measure the same whether or not the theory holds --
  # a null result that says nothing.
  volume: 100000
  streamDesign: TAGGED
  composition: CLEAN
  payload: REALISTIC
  entityCount: 2000
  seed: 20260823

targets:
  # postgres:18 only. The version question -- whether xid8 behaves in a row comparison on 16 and 17
  # as well -- is a correctness-and-plan-shape question rather than a throughput one, and
  # PostgresCursorBoundaryFormTest answers it on all three in seconds. Paying for two more targets
  # here would buy a slower answer to a question already settled.
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF
    cursorBoundary: EXPANDED_OR
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF
    cursorBoundary: ROW_COMPARISON

jmh:
  workloads:
    # The two that carry a cursor, and the reason the profile exists. query-cursor-walk starts from
    # the corpus midpoint, so its cursor is 50.000 events deep; replay-batches pages a Projector and
    # additionally exercises the until boundary, which is the same predicate with <=.
    - query-cursor-walk
    - replay-batches
    # Read control: one page, no cursor, so the boundary never appears in its SQL. It must not move.
    - query-stream-page
    # Write control: an unconditional append takes no boundary either, so it must not move. Between
    # the two controls, a difference that shows up on both is the machine and not the spelling.
    - append-none
    # The conditional appends carry the boundary inside a NOT EXISTS, where a cheap and legibly
    # selective conjunct is worth more than the scan it saves: it is also what the planner prices the
    # whole statement from. append-type-and-tag is the canonical DCB check; or-groups-3 is the width
    # at which this corpus was seen to abandon index access altogether.
    - append-type-and-tag
    - append-or-groups-3
    - decide-then-append
  threads: [ 1 ]
  forks: 4
  warmupIterations: 3
  measurementIterations: 5
  iterationSeconds: 2
