name: dcb-boundary-staleness
description: >
  What cursor age does to the two DCB check shapes, over the large-tier corpus. The scan-from-cursor
  run showed the ordered probe 5x better on the workload's own boundaries -- but those cursors sit
  wherever each entity's last event does, which the Zipf walk keeps fresh for the entities it visits
  most. Cursor age is exactly the variable the shapes disagree about: the tag path reads the entity's
  whole history whatever the cursor says, and the forward walk pays for every stream event after it.
  This profile pins the age instead of sampling it, at the three points that bracket the regime:

    append-type-and-tag     the boundary read at append time -- fresh-ish, the ordinary decider
    append-stale-boundary   a cursor half the stream old, filter matching nothing, so every
                            invocation proves absence over the full walk -- the probe's bad case,
                            and the tag path's best (a GIN lookup finding zero entries)
    append-empty-boundary   no cursor at all -- under the probe the walk has nowhere to start and
                            must cover the whole stream; under NOT EXISTS it is a cheap tag miss.
                            The degenerate case that decides whether the probe can ever simply
                            replace the old shape, or must be chosen per criteria

  What the first run of this profile decided: neither fixed shape wins. The probe took the fresh row
  5.5x and, unexpectedly, the stale row 1.9x -- because NOT EXISTS forfeited its own best case to the
  plan cache, running the 1.16s sequential scan in steady state on both the stale and the empty
  boundary while its 0.06ms custom plan sat unused. The empty row tied at ~1164ms, a whole-stream
  walk against a whole-table scan. That run is why BY_CRITERIA exists: the probe when the criteria
  carries a cursor, the tag path planned from its bound values -- never from the plan cache -- when
  it does not.

  This profile now runs the default against BY_CRITERIA, and it is the candidate default's
  validation run: the one cell no run has measured in steady state is the no-cursor branch at ten
  million events. The prediction, written before the run: append-empty-boundary collapses from
  ~1164ms/op to under a millisecond of check (sub-ms tag miss plus the ~0.33ms append), turning the
  1.4 ops/s row into hundreds; append-type-and-tag matches the probe's ~12ms/op from the earlier
  run; append-stale-boundary stays at the probe's ~605ms -- the accepted cost of an ancient cursor,
  bounded, linear and documented, on a path a real decider avoids by re-reading before appending.
  If empty-boundary does NOT collapse, the forced-custom mechanism is not reaching the server and
  the design is not ready.

  Same corpus as large-tier-writes, so nothing re-provisions; same drift reasoning, same warning
  about the estimate: the per-trial restore of ten million rows dominates the wall clock, so expect
  around an hour and a half for the twenty-four trials against an estimate of a fraction of that.

corpus:
  volume: 10000000
  streamDesign: TAGGED
  composition: CLEAN
  payload: REALISTIC
  entityCount: 100000
  seed: 20260823

targets:
  - backend: POSTGRES
    server: EXTERNAL
    metrics: OFF
    schemaMode: ENSURE
  - backend: POSTGRES
    server: EXTERNAL
    metrics: OFF
    schemaMode: ENSURE
    appendCheck: BY_CRITERIA

jmh:
  workloads:
    - append-none
    - append-type-and-tag
    - append-stale-boundary
    - append-empty-boundary
  # One thread: staleness is a property of the cursor, not of contention, and the fresh/stale/empty
  # comparison is cleanest with nothing else moving the stream head mid-walk.
  threads: [ 1 ]
  forks: 3
  warmupIterations: 2
  measurementIterations: 4
  iterationSeconds: 4
  maxDrift: 0.10
