name: dcb-boundary-staleness
description: >
  What cursor age does to the DCB check, over the large-tier corpus. The check's shape is derived from
  the criteria -- the ordered probe walking the position index forward from the cursor when one is
  present, the custom-planned tag path when not -- and cursor age is the one variable the probe pays
  for: every stream event after the cursor is a row it walks past to prove absence. This profile pins
  the age at the points that bracket the regime:

    append-type-and-tag       the boundary as the traffic-weighted walk presents it -- cursors as
                              fresh or as stale as the corpus's own write mix makes them
    decide-then-append-fresh  the recommended decider: boundary read bounded, and the append
                              presents the freshest reference the read observed (the stream head,
                              read before the boundary), so the probe starts where the reader
                              stopped -- the cursor path's floor
    append-stale-boundary     a cursor pinned half the stream old, filter matching nothing, so
                              every invocation proves absence over the full walk -- the ceiling
    append-empty-boundary     no cursor at all -- routed to the tag path, so this row is what the
                              uniqueness pattern ("this basket was never checked out") costs

  The measured curve, from this profile's published run (external PG18, one thread, append-none at
  0.32ms/op as the floor): empty ~2.3ms/op, traffic mix ~26ms/op, pinned-stale ~590ms/op at 0.7%
  relative error -- 2.75M rows walked at ~0.215us each, linear and predictable. The traffic-mix row
  is also a renewal identity made visible: under any stationary write mix the mean probe walk is
  about one event per entity active in the stream, so it lands at ~0.22us times the entity count
  (100k here) whatever the skew. The rejected alternative -- one uniform NOT EXISTS check left to
  the plan cache -- measures 66ms at 117% error, 1164ms and 1164ms on comparable rows: the plan
  cache settles on a whole-table sequential scan for the stale and empty boundaries while a 0.06ms
  custom plan sits unused, which is the measurement behind deriving the check's shape from the
  criteria instead.

  The stale row is the check's one accepted cost, and how a caller avoids it depends on why the
  cursor is old. A decider whose entity has been moving gets a fresh cursor by re-reading the
  boundary, which a conflict-retry loop does anyway. A decider whose entity is long idle does not --
  its last matching event simply is old, and re-reading cannot advance a cursor past events that do
  not exist. What the read does establish is that nothing matching sits between that old cursor and
  the head it read at, so presenting the head claims exactly what was proven and the probe walk
  collapses: that is decide-then-append-fresh, and the one rule it must keep is to read the head
  before the boundary, so everything at or below the presented head was visible to the read that
  decided.

  Same corpus as large-tier-writes, so nothing re-provisions; same drift reasoning, same warning
  about the estimate: the per-trial restore of ten million rows dominates the wall clock, so expect
  around triple the estimate for the twelve trials.

corpus:
  volume: 10000000
  streamDesign: TAGGED
  composition: CLEAN
  payload: REALISTIC
  entityCount: 100000
  seed: 20260823

targets:
  - backend: POSTGRES
    server: EXTERNAL
    metrics: OFF
    schemaMode: ENSURE

jmh:
  workloads:
    - append-none
    - append-type-and-tag
    - decide-then-append-fresh
    - append-stale-boundary
    - append-empty-boundary
  # One thread: staleness is a property of the cursor, not of contention, and the fresh/stale/empty
  # comparison is cleanest with nothing else moving the stream head mid-walk.
  threads: [ 1 ]
  forks: 3
  warmupIterations: 2
  measurementIterations: 4
  iterationSeconds: 4
  maxDrift: 0.10
