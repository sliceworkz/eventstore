name: dcb-plan-cache-small
description: >
  The small-store half of the plan-cache pair. Identical to dcb-plan-cache in targets, workloads and
  entity density -- 50 events per entity, as there -- and differing in the one property that decides
  whether planning per append is worth paying for: the size of the table it is planning against.

  Why the size is the question. Planning a conditional append costs the same whatever the store
  holds; what it buys is a sequential scan avoided, and that scan is proportional to the table. At
  100.000 events the scan is ~15ms and the trade is not close. At 5.000 the whole events table is a
  few hundred pages, a scan of it is microseconds, and there is nothing left for the planning to
  save. If PER_APPEND is a net loss anywhere, it is here -- and a recommendation that does not say so
  would be advice to make small stores slower.

  Read this against dcb-plan-cache with `compare`, and read append-none first: it takes no
  consistency check and so cannot be affected by the setting in either profile. Where it moves, the
  machine moved.

  EXPERIMENT (this branch): the third target ran the pinned ordered probe first and came back as
  predicted -- indistinguishable from the default on seven of ten rows, harmless on the empty
  boundary, and better on the two rows where the default hit the small-store cliff at three facts.
  It now runs BY_CRITERIA, the candidate default; at this size the two shapes it routes between are
  both cheap, so the prediction is the boring one this profile exists to be able to state: nothing
  measurable separates BY_CRITERIA from the default anywhere on a 5.000-event store, and the cliff
  rows keep the probe's improvement.

corpus:
  # 5.000, not 1.000, and the reason is worth writing down because 1.000 was tried first and measured
  # something other than what it said. Two constraints bind from below, neither about the plan cache:
  #
  #   - append-or-groups-10 needs nine distinct companion entities, and the companion band is a
  #     quarter of the entity space -- so entityCount must be at least 36 or companionEntity() wraps
  #     and the same tag appears twice in one filter. At entityCount 20 it built ten disjuncts over
  #     six distinct SKUs and reported them as a ten-fact decision. WorkloadRequirement now refuses
  #     that pairing instead of measuring it, so this profile could not have stayed at 20 anyway.
  #   - a 2-second iteration of append-none puts ~24.000 events into the store. Against a
  #     1.000-event corpus that is a 25-fold growth *within* one iteration. The restore between
  #     iterations does its job and drift reads 0.00%, so nothing looks wrong -- but the table the
  #     numbers came from was never the size on the label, and the plans, captured against the
  #     restored corpus, describe a different table from the one that was measured.
  #
  # 5.000 events with a 1-second iteration keeps every *conditional* workload inside a factor of two
  # of the nominal size (measured: 27-70% growth) and leaves nine companions available, while staying
  # twenty times smaller than the 100.000-event corpus -- which is the comparison this profile makes.
  #
  # append-none is the exception and cannot be fixed by sizing: it takes no consistency check, so it
  # runs five times faster than anything else here and puts ~11.000 events in during its second --
  # 251% growth, which the run summary now prints. That does not damage what the control is for. It
  # exists to say whether the machine moved between the two targets, and an unconditional append's
  # plan does not depend on the table's size the way a DCB check's does.
  volume: 5000
  streamDesign: TAGGED
  composition: CLEAN
  payload: REALISTIC
  # 50 events per entity, the same density as the 100.000-event corpus. Holding the density rather
  # than the entity count is what keeps a tag as selective here as there, so the difference between
  # the two profiles is the table's size and not how much of it a boundary matches.
  entityCount: 100
  seed: 20260823

targets:
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF
    appendPlanning: SERVER_DEFAULT
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF
    appendPlanning: PER_APPEND
  # The criteria-shaped check; see dcb-plan-cache for what this target is for.
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF
    appendCheck: BY_CRITERIA

jmh:
  workloads:
    - append-none
    - append-types
    - append-type-and-tag
    - append-multi-tag
    - append-or-groups-2
    - append-or-groups-3
    - append-or-groups-5
    - append-or-groups-10
    - append-empty-boundary
    - decide-then-append
  threads: [ 1 ]
  forks: 4
  warmupIterations: 3
  measurementIterations: 5
  # one second, not two: see the corpus note. The store grows under every one of these workloads, so
  # the iteration length is what decides how far it drifts from the size being characterised.
  iterationSeconds: 1
