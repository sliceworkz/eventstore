name: large-tier-writes
description: >
  What an append costs at ten million events, against the same corpus large-tier reads. Split out from
  that profile rather than sharing it, because the two cannot be measured the same way: a read leaves
  the store alone and can be given as long as it needs, while an append grows it, and above a million
  events the corpus is restored once per trial rather than once per iteration -- a template copy of ten
  million rows between iterations would cost far more than the drift it prevents.

  So an append workload here has a budget denominated in events, not seconds, and the budget does not
  grow with the tier. That is the whole reason this profile declares a drift cap of its own. At two
  percent, the suite-wide default, ten million events allow 200.000 appends per trial: about eighty
  seconds at one writer, and under ten at eight -- less than a single JMH iteration. No cadence fits
  that, and the run that discovered it died at 72% having thrown away forty minutes of clean reads.

  Ten percent is a judgement, and it is about the label rather than the measurement. What a fraction
  of growth threatens is the claim "measured over ten million events"; it does not change a B-tree's
  depth or a GIN index's shape, so an append measured while the store went from 10.0M to 10.9M is
  measuring the same operation throughout. The cap is recorded in the manifest and printed in the
  report beside the drift, so a reader comparing this against a run measured under the default two
  percent can see that the allowance was widened deliberately.

  If a fast enough server breaches ten percent anyway, shorten the iterations -- do not widen the cap
  further. Past roughly a tenth the corpus stops being the one the manifest names. In the event the
  first captured run came in at 1.12%, so the allowance has never been needed: it was sized against an
  assumed ~25 ops/ms at eight writers where the real figure is 4.7. Left as it is rather than tightened
  to the default, because a server faster than that one should not fail a two-hour run over a label.

  One caveat before reading any of these against the medium tier: at a hundred thousand entities the
  per-iteration boundary cache almost never gets a hit, so nearly every append-type-and-tag invocation
  here is a boundary probe plus the append, where the medium tier amortizes the probe over a whole
  iteration. Compare decide-then-append across tiers -- it always includes its read -- and treat this
  tier's append-type-and-tag as a different operation mix rather than the same workload at more volume.

  Budget more wall clock than the estimate promises. The estimator counts iteration time only, and at
  this tier the restore dominates it: taking the template costs seconds, but handing the store back at
  the end of each trial is a truncate-and-copy of ten million rows, about two and a half minutes, once
  per trial. With two targets that is thirty-six trials, so expect something over an hour and a half
  against an estimate of a quarter of that. The run that carried a third target took just under four.

  What to read first: the captured plans, not the throughputs. A DCB check carrying one type and one
  tag really does cost about 190x an unconditional append at this volume, and the store's own
  statements say where that goes:

    custom   Bitmap Heap Scan via idx_events_stream_tags, cursor in the Filter,
             16.806 rows discarded, exact=16.125 heap blocks, 19.965 buffers, 44.4 ms
    generic  Seq Scan, every predicate in the Filter, 10.000.008 rows discarded,
             433.299 buffers, 1251 ms

  Both plans are for the same statement. The custom plan is the expensive one to look at and the
  cheap one to run: knowing the tag value sends it to the tag index, so it materialises the entity's
  whole history and applies the cursor afterwards as a filter rather than as a start condition. That
  materialisation is the 190x. The generic plan, with no value to be selective on, does not fall back
  to the stream index -- it scans the table.

  PostgreSQL prices custom at 130.35 against generic at 250.21 and keeps the custom one, which is the
  right choice. So neither planning mode is a remedy here: PER_APPEND forces the plan already in
  effect and moves nothing, and pinning the generic plan is a 20x pessimisation.

  This profile carried a third target that did exactly that, and its job is done. An earlier capture
  had been read as showing the generic plan doing an index scan at 0.242 ms -- that plan belongs to
  append-types, the types-only check, which has no tag value to distract the planner -- and the
  conclusion drawn from it, that forcing generic was the remedy at this tier, was wrong. Measuring it
  cost one target and settled it: 1248.50 ms/op against the default's 66.03, and 48 useful appends in
  a trial against 731. Reading a ratio off two plans is not the same as measuring it, and this is the
  run where the difference mattered.

  One thing the throughputs say that the plans do not, and it is unresolved. Every conditional-append
  row on a target running the custom plan came back at 47-147% relative error, which is a refusal to
  publish rather than a number. Two things could produce it and this run cannot separate them: the
  Zipf entity walk, whose per-operation cost ramps from ~35 ms/op mid-tail to ~1000 ms/op on the head
  entity, and the plan cache occasionally serving the 1.25-second generic plan -- about 2% of appends
  would account for the gap between the 44 ms custom plan and the 66 ms/op measured. The removed
  force-generic target's tight error bars look like evidence for the second and are not: a sequential
  scan costs the same whatever entity it is asked about, so pinning it flattens the entity ramp too.
  Permuting the entity walk removes the first cause and is what would settle it.

corpus:
  volume: 10000000
  streamDesign: TAGGED
  composition: CLEAN
  payload: REALISTIC
  entityCount: 100000
  seed: 20260823

targets:
  # Three stores over one corpus, differing in one setting, so the run answers the question rather than
  # needing three runs and a `compare`. The first is what an application gets by default: PostgreSQL
  # holds a custom and a generic plan for the DCB check and picks between them on estimated cost.
  - backend: POSTGRES
    server: EXTERNAL
    metrics: OFF
    schemaMode: ENSURE
  # Forces the custom plan -- re-planned from the values actually being bound. This is the remedy for
  # the cliff the dcb-cost-curve profile measures, where several OR-ed facts make the generic plan look
  # cheaper than it is. It is not free (CLAUDE.md records 2.4x on a types-only filter), which is why it
  # is measured beside the default rather than switched on for everyone.
  #
  # Kept in this profile even though it changes nothing here: that null result is the evidence that the
  # default already picks custom at this volume, and dropping the target would leave the claim resting
  # on the plans alone.
  - backend: POSTGRES
    server: EXTERNAL
    metrics: OFF
    schemaMode: ENSURE
    appendPlanning: PER_APPEND

jmh:
  workloads:
    - append-none
    - append-type-and-tag
    - decide-then-append
  # append-none is the control that must not move between thread counts for reasons of contention: it
  # takes no advisory lock and reads no boundary, so what it measures is the insert and the round trip.
  threads: [ 1, 8 ]
  # Shorter than the read profiles', and the length is set by the drift budget rather than by what the
  # statistics would like: six iterations of four seconds is 24s of appending per trial, which at the
  # eight-thread rate an external server should manage lands around 6% -- inside the 10% below, with
  # room for a server faster than the one this was sized against.
  forks: 3
  warmupIterations: 2
  measurementIterations: 4
  iterationSeconds: 4
  maxDrift: 0.10
