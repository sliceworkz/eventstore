name: metrics-cost
description: >
  What the library's own instrumentation costs, measured rather than assumed. One corpus, three
  stores over it: no meters, the default cap of a thousand distinct purposes, and no cap at all.
  All three in one run, so the comparison needs no second report and no environment to match.

  The corpus is deliberately PER_ENTITY with two thousand entities, which is the configuration where
  the cap does something: an uncapped store registers a meter set per purpose and keeps every one of
  them for the life of the process, while the capped store pools everything past the first thousand
  into `_other`. Under a TAGGED design all three targets would look identical, which would be a true
  measurement of the wrong thing.

  The targets run uninstrumented LAST, and the order is the measurement rather than a preference.
  A run in the other order reported the two instrumented stores 8% FASTER than the uninstrumented
  one on both append workloads -- which meters cannot do -- while the two instrumented targets sat
  0.7% apart, inside their error bars. That is the signature of position in the run, not of the
  setting: the corpus is generated inside the first fork of the first target, so that target is
  measured against a server the ones after it inherit warm. Whichever target goes first pays for it.

  So read this profile as a pair of comparisons, not one. Capped against unlimited is clean -- same
  position, adjacent in the order -- and is where the cap's throughput cost is actually visible.
  Uninstrumented against either is confounded by order, and the only honest reading of it is the
  difference between what this run says and what the reverse order said. If metrics=off comes out
  fastest here having come out slowest there, the gap is the ordering and the meters cost nothing
  measurable; if it comes out slowest in both, the effect is real and worth chasing.

corpus:
  volume: 100000
  streamDesign: PER_ENTITY
  composition: CLEAN
  payload: REALISTIC
  entityCount: 2000
  seed: 20260823

targets:
  # Reversed deliberately -- see the description. The first target absorbs the corpus generation and
  # a cold server, so putting the uninstrumented store last is what makes the previous run's result
  # falsifiable rather than repeating it with the handicap in the same place.
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: UNLIMITED
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: CAPPED
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF

jmh:
  workloads:
    - append-none
    - append-type-and-tag
    - query-by-entity-hot
    - query-last-event
  threads: [ 1 ]
  forks: 4
  warmupIterations: 3
  measurementIterations: 5
  iterationSeconds: 2
