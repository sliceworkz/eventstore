name: shredding-cost
description: >
  What crypto-shredding costs per event. The read-side comparison is exact: query-crm-shredded and
  query-crm-raw read the very same events off the very same store, and raw mode does not decrypt --
  so the gap between them is the unseal plus binding the result to a record, over identical bytes.

  The write side is a pair rather than a ratio. append-crm-shredded seals a value for a customer the
  corpus already holds; append-crm-new-subject seals one for a customer nobody has seen, so a key has
  to be minted and stored first. The difference is what the first event for a data subject costs --
  the part of shredding that scales with people rather than with events.

  Beside them, append-none from the same run, as the absolute floor. That comparison crosses two
  contexts and two payload shapes, so read it as a figure and not as a multiplier.

  Note the corpus is generated by appending rather than by bulk import: sealed envelopes come out of
  the store's own serializer and cannot be written any other way. That makes provisioning far slower
  than the other profiles and is why this one stays at the medium tier.

corpus:
  volume: 20000
  streamDesign: TAGGED
  composition: CLEAN
  payload: SHREDDED
  entityCount: 500
  seed: 20260823

targets:
  - backend: INMEM
    shredding: true
    metrics: OFF
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    shredding: true
    metrics: OFF

jmh:
  workloads:
    - query-crm-shredded
    - query-crm-raw
    - append-crm-shredded
    - append-crm-new-subject
    - append-none
  threads: [ 1 ]
  forks: 2
  warmupIterations: 2
  measurementIterations: 3
  iterationSeconds: 5
