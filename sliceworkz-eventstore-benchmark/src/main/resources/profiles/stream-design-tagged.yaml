name: stream-design-tagged
description: >
  One stream per bounded context, entities told apart by tags. Half of the shootout: run this and
  stream-design-per-entity, then `compare` them. Their corpora differ in exactly one property, which
  is what makes the percentage between them mean something.

  Under this design every event in the context shares the btree prefix, so it is unselective and the
  reads lean on the (stream_context, stream_purpose, event_tags) GIN index. Appends conditional on a
  single entity all hash to the same advisory lock key, since the key is the stream -- so the
  contention story is the other half of the trade and write-contention-one-stream is where it shows.

  The query-by-stream-* and query-last-event-by-stream workloads are here as the control half of the
  addressing pairs described in stream-design-per-entity. On a tagged corpus a tag filter is the only
  way to isolate an entity, so each is the same query as its query-by-entity-* counterpart and must
  report the same number. A gap between a pair here is a harness fault, not a finding.

corpus:
  volume: 100000
  streamDesign: TAGGED
  composition: CLEAN
  payload: REALISTIC
  entityCount: 2000
  seed: 20260823

targets:
  - backend: INMEM
    metrics: OFF
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF

jmh:
  workloads:
    - query-by-entity-hot
    - query-by-entity-cold
    - query-by-stream-hot
    - query-by-stream-cold
    - query-by-tag-needle
    - query-by-tag-swathe
    - query-last-event
    - query-last-event-by-stream
    - query-stream-page
    - append-none
    - append-type-and-tag
    - decide-then-append
  threads: [ 1, 8 ]
  forks: 2
  warmupIterations: 2
  measurementIterations: 3
  iterationSeconds: 5
