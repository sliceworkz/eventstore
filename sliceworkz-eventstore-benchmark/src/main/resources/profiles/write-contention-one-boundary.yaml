name: write-contention-one-boundary
description: >
  Every writer appending at the same DCB boundary, so most of them lose: an OptimisticLockingException
  is the expected outcome here, not an error. Throughput alone is misleading in this profile and the
  report says so -- a store can raise its operations per second while lowering the work done, and only
  the conflict rate beside it says which happened. Read the "useful/s" column, not the score.

  PER_ENTITY to match the other two contention profiles, so the three differ in the collision mode
  and in nothing else. Under this design one boundary is also one stream, so this profile carries the
  lock and the conflicts together; write-contention-one-stream is what isolates the first half.

corpus:
  volume: 100000
  streamDesign: PER_ENTITY
  composition: CLEAN
  payload: REALISTIC
  entityCount: 2000
  seed: 20260823

targets:
  - backend: INMEM
    metrics: OFF
  - backend: POSTGRES
    server: TESTCONTAINERS
    image: "postgres:18"
    metrics: OFF

jmh:
  workloads:
    - append-none
    - append-type-and-tag
    - decide-then-append
  threads: [ 1, 4, 8, 16 ]
  collision: one-boundary
  forks: 4
  warmupIterations: 3
  measurementIterations: 5
  iterationSeconds: 2
